<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme-preference');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
          }
        } catch (e) {}
      })();
    </script>
    
    <title>PDF Toolbox — All-in-One Private, Fast & Modular PDF Utilities</title>
    <meta name="description" content="Merge, split, compress, edit, convert, and protect PDF documents securely in your browser. Fast, private, client-first processing with zero data leaks." />
    <meta name="keywords" content="PDF tools, merge PDF, split PDF, compress PDF, convert PDF, PDF editor, private PDF toolbox, free PDF utilities" />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
